version: '3'

env:
  REPO_ROOT: '{{.ROOT_DIR}}'
  ISUTOOLS_BRANCH: '{{.BRANCH | default ""}}'

tasks:
  inspect:
    desc: 初期構成を調査して docs/inventory に保存（引数省略時は HOSTS）
    cmds:
      - python3 -m isutools inspect {{.CLI_ARGS}}

  bootstrap:
    desc: 初期セットアップ → 取り込み → デプロイ → 計測設定（1人が1回）
    cmds:
      - python3 -m isutools bootstrap

  deploy:
    desc: push 済みコミットを全ホストへデプロイ（BRANCH=xxx で指定可）
    cmds:
      - python3 -m isutools deploy

  bench:
    desc: 全ホストへデプロイしてポータルベンチを1回実行
    silent: true
    cmds:
      - python3 -m isutools bench

  status:
    desc: 全ホストの commit・デプロイ者・サービス・ロックを確認
    cmds:
      - python3 -m isutools status

  unlock:
    desc: 残ったデプロイロックを解除（-- -y で確認省略）
    cmds:
      - python3 -m isutools unlock {{.CLI_ARGS}}

  pprotein:
    desc: ポート転送して計測 UI を開く（Ctrl-C で終了）
    cmds:
      - python3 -m isutools pprotein

  pprotein:targets:
    desc: 計測対象を切り替える（-- single または -- split）
    cmds:
      - python3 -m isutools targets {{.CLI_ARGS}}

  test:
    desc: 運用ツールと Node プロファイラの全テスト
    cmds:
      - task: test:python
      - task: test:node

  test:python:
    desc: 運用ツールの unittest（外部サーバーに接続しない）
    cmds:
      - python3 -m unittest discover -s isutools/tests -p 'test_*.py' -v

  test:inventory:
    aliases: [inspect:test]
    desc: 初期構成調査の unittest
    cmds:
      - python3 -m unittest discover -s isutools/tests -p test_initial_inventory.py -v

  test:node:
    desc: Node プロファイラと収集スニペットのテスト
    cmds:
      - cd isutools/profiler && npm ci --no-audit --no-fund --silent
      - node --test isutools/profiler/profiler.test.cjs
      - node --experimental-strip-types --test isutools/snippets/pprotein-collect.test.ts
