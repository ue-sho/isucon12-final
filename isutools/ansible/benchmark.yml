---
# task bench がサーバーのロックを保持したまま実行する。
- name: Run one portal benchmark on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Start the benchmark and wait for its terminal status
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/portal_bench.py"
      register: portal_bench
      changed_when: true
      failed_when: false

    - name: Show benchmark output
      ansible.builtin.debug:
        msg: "{{ portal_bench.stdout_lines + portal_bench.stderr_lines }}"

    - name: Notify Discord of the benchmark result
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - isutools
          - notify
          - |-
            ▶ benchmark: {{ 'success' if portal_bench.rc == 0 else 'failed' }}
            ▶ branch: {{ lookup('env', 'ISUTOOLS_BENCH_BRANCH') }} ({{ lookup('env', 'ISUTOOLS_BENCH_REV') }})
            {{ portal_bench.stdout_lines | last | default('結果なし', true) }}
            {{ portal_bench.stderr }}
            {{ portal_bench.stdout_lines[:-1][-8:] | join('\n') }}
        chdir: "{{ playbook_dir }}/../.."
      changed_when: true
      failed_when: false # 通知失敗はベンチ自体の成否に影響させない

    - name: Require a successful benchmark result
      ansible.builtin.assert:
        that: portal_bench.rc == 0
        fail_msg: ベンチが失敗しました。上記の出力とポータルのジョブ状態を確認してください。
